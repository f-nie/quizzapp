x-arcane:
  icon: https://infyicon.com/i2/color-fill/svg/interrogation-faq_29327.svg
  urls:
    - https://github.com/f-nie/quizzapp/

name: quiz

services:
  quiz:
    image: quizzapp:latest
    container_name: quiz
    restart: unless-stopped
    
    networks:
      - quiz
#    ports:
#      - ${APP_PORT:-3000}:3000

    volumes:
      - db:/app/db
    
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    labels:
      com.centurylinklabs.watchtower.enable: false
      com.getarcaneapp.arcane.icon: https://infyicon.com/i2/color-fill/svg/interrogation-faq_29327.svg
  
volumes:
  db:

networks:
  quiz:
    name: ${NETWORK:-quiz}